<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
<title>怎麼知道影片真的做對了</title>
<rect width="1000" height="520" rx="18" fill="#f7f5ef"/>
<text x="46" y="68" font-size="30" font-family="sans-serif" fill="#172b3a">第20章｜怎麼知道影片真的做對了</text>
<rect x="36" y="105" width="928" height="98" rx="12" fill="#e1efea"/>
<text x="58" y="138" font-size="21" font-family="sans-serif" fill="#0b746b">數值與重現</text>
<text x="58" y="177" font-size="22" font-family="sans-serif" fill="#172b3a">規則、邊界、同一輸入</text>
<rect x="36" y="220" width="928" height="98" rx="12" fill="#edf0f2"/>
<text x="58" y="253" font-size="21" font-family="sans-serif" fill="#0b746b">媒體</text>
<text x="58" y="292" font-size="22" font-family="sans-serif" fill="#172b3a">中繼資料 → 完整解碼</text>
<rect x="36" y="335" width="928" height="98" rx="12" fill="#fff0d7"/>
<text x="58" y="368" font-size="21" font-family="sans-serif" fill="#0b746b">觀看與聽審</text>
<text x="58" y="407" font-size="22" font-family="sans-serif" fill="#172b3a">構圖／正反面／發音／理解，各有證據</text>
<text x="46" y="496" font-size="18" font-family="sans-serif" fill="#60717a">原創教學對照｜數字見逐章檢查｜無原片演算法推定</text>
</svg>