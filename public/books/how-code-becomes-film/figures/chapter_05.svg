<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
<title>為什麼等速看起來像機器</title>
<rect width="1000" height="520" rx="18" fill="#f7f5ef"/>
<text x="46" y="68" font-size="30" font-family="sans-serif" fill="#172b3a">第5章｜為什麼等速看起來像機器</text>
<rect x="36" y="105" width="928" height="98" rx="12" fill="#e1efea"/>
<text x="58" y="138" font-size="21" font-family="sans-serif" fill="#0b746b">半秒：u=0.25</text>
<text x="58" y="177" font-size="22" font-family="sans-serif" fill="#172b3a">等速250；緩動193.75</text>
<rect x="36" y="220" width="928" height="98" rx="12" fill="#edf0f2"/>
<text x="58" y="253" font-size="21" font-family="sans-serif" fill="#0b746b">一秒：u=0.5</text>
<text x="58" y="292" font-size="22" font-family="sans-serif" fill="#172b3a">兩者400；只看中點不足</text>
<rect x="36" y="335" width="928" height="98" rx="12" fill="#fff0d7"/>
<text x="58" y="368" font-size="21" font-family="sans-serif" fill="#0b746b">一點五秒：u=0.75</text>
<text x="58" y="407" font-size="22" font-family="sans-serif" fill="#172b3a">等速550；緩動606.25</text>
<text x="46" y="496" font-size="18" font-family="sans-serif" fill="#60717a">原創教學對照｜數字見逐章檢查｜無原片演算法推定</text>
</svg>