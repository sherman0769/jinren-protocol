<text x="58" y="407" font-size="22" font-family="sans-serif" fill="#172b3a">1/60：0.00953；1/120：0.00473；1/240：0.00236</text>
<text x="46" y="496" font-size="18" font-family="sans-serif" fill="#60717a">原創教學對照｜數字見逐章檢查｜無原片演算法推定</text>
