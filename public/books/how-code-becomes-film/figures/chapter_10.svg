<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
<title>散點怎麼排成一個字</title>
<rect width="1000" height="520" rx="18" fill="#f7f5ef"/>
<text x="46" y="68" font-size="30" font-family="sans-serif" fill="#172b3a">第10章｜散點怎麼排成一個字</text>
<rect x="36" y="105" width="928" height="98" rx="12" fill="#e1efea"/>
<text x="58" y="138" font-size="21" font-family="sans-serif" fill="#0b746b">形狀</text>
<text x="58" y="177" font-size="22" font-family="sans-serif" fill="#172b3a">四條矩形筆畫：自繪井形</text>
<rect x="36" y="220" width="928" height="98" rx="12" fill="#edf0f2"/>
<text x="58" y="253" font-size="21" font-family="sans-serif" fill="#0b746b">取樣</text>
<text x="58" y="292" font-size="22" font-family="sans-serif" fill="#172b3a">本基準330個不重複目標</text>
<rect x="36" y="335" width="928" height="98" rx="12" fill="#fff0d7"/>
<text x="58" y="368" font-size="21" font-family="sans-serif" fill="#0b746b">資料到運動</text>
<text x="58" y="407" font-size="22" font-family="sans-serif" fill="#172b3a">同數起點 → 穩定索引配對 → 插值</text>
<text x="46" y="496" font-size="18" font-family="sans-serif" fill="#60717a">原創教學對照｜數字見逐章檢查｜無原片演算法推定</text>
</svg>