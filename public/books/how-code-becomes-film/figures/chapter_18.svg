<text x="58" y="292" font-size="22" font-family="sans-serif" fill="#172b3a">1.6，1.8，1.9 → 結束1.6，3.8，5.9</text>
<rect x="36" y="335" width="928" height="98" rx="12" fill="#fff0d7"/>
