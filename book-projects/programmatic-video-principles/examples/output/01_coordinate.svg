ily="Microsoft JhengHei,PingFang TC,Noto Sans CJK TC,sans-serif">原點 (0,0)</text><text x="570" y="101" font-size="18" fill="#172b3a" font-family="Microsoft JhengHei,PingFang TC,Noto Sans CJK TC,sans-serif">x 往右增加 →</text><text x="714" y="180" font-size="18" fill="#172b3a" font-family="Microsoft JhengHei,PingFang TC,Noto Sans CJK TC,sans-serif">y 往下</text><text x="714" y="208" font-size="18" fill="#172b3a" font-family="Microsoft JhengHei,PingFang TC,Noto Sans CJK TC,sans-serif">增加 ↓</text><text x="564" y="439" font-size="18" fill="#172b3a" font-family="Microsoft JhengHei,PingFang TC,Noto Sans CJK TC,sans-serif">(960,540)</text><text x="48" y="461" font-size="21" fill="#172b3a" font-family="Microsoft JhengHei,PingFang TC,Noto Sans CJK TC,sans-serif">以縮小的畫布示意；座標數字仍以原畫布像素為單位</text><text x="48" y="506" font-size="16" fill="#60717a" font-family="Microsoft JhengHei,PingFang TC,Noto Sans CJK TC,sans-serif">程式如何變成影片｜教學重建，不是原引擎摘錄</text></svg>