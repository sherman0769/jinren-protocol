<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img"><title>同樣兩秒、同樣終點，節奏可以不同</title><desc>九個等時間間隔的取樣位置。緩動兩端較密，中間較疏。</desc><rect width="960" height="540" fill="#f7f5ef"/><text x="48" y="63" font-size="30" fill="#172b3a" font-family="Microsoft JhengHei,PingFang TC,Noto Sans CJK TC,sans-serif">同樣兩秒、同樣終點，節奏可以不同</text><line x1="150" y1="185" x2="750" y2="185" stroke="#60717a" stroke-width="2"/><text x="48" y="135" font-size="24" fill="#172b3a" font-family="Microsoft JhengHei,PingFang TC,Noto Sans CJK TC,sans-serif">等速</text><circle cx="150.0000" cy="185.0000" r="5" fill="#172b3a"/><circle cx="225.0000" cy="185.0000" r="5" fill="#172b3a"/><circle cx="300.0000" cy="185.0000" r="13" fill="#172b3a"/><circle cx="375.0000" cy="185.0000" r="5" fill="#172b3a"/><circle cx="450.0000" cy="185.0000" r="5" fill="#172b3a"/><circle cx="525.0000" cy="185.0000" r="5" fill="#172b3a"/><circle cx="600.0000" cy="185.0000" r="5" fill="#172b3a"/><circle cx="675.0000" cy="185.0000" r="5" fill="#172b3a"/><circle cx="750.0000" cy="185.0000" r="5" fill="#172b3a"/><line x1="150" y1="315" x2="750" y2="315" stroke="#60717a" stroke-width="2"/><text x="48" y="265" font-size="24" fill="#172b3a" font-family="Microsoft JhengHei,PingFang TC,Noto Sans CJK TC,sans-serif">慢起步、慢停下</text><circle cx="150.0000" cy="315.0000" r="5" fill="#0b746b"/><circle cx="175.7812" cy="315.0000" r="5" fill="#0b746b"/><circle cx="243.7500" cy="315.0000" r="13" fill="#0b746b"/><circle cx="339.8438" cy="315.0000" r="5" fill="#0b746b"/><circle cx="450.0000" cy="315.0000" r="5" fill="#0b746b"/><circle cx="560.1562" cy="315.0000" r="5" fill="#0b746b"/><circle cx="656.2500" cy="315.0000" r="5" fill="#0b746b"/><circle cx="724.2188" cy="315.0000" r="5" fill="#0b746b"/><circle cx="750.0000" cy="315.0000" r="5" fill="#0b746b"/><text x="48" y="408" font-size="23" fill="#172b3a" font-family="Microsoft JhengHei,PingFang TC,Noto Sans CJK TC,sans-serif">每個點相隔 0.25 秒；比較相同時間的位移</text><text x="48" y="446" font-size="21" fill="#172b3a" font-family="Microsoft JhengHei,PingFang TC,Noto Sans CJK TC,sans-serif">四分之一時間：等速走 25%；本例緩動走 15.625%</text><text x="48" y="506" font-size="16" fill="#60717a" font-family="Microsoft JhengHei,PingFang TC,Noto Sans CJK TC,sans-serif">程式如何變成影片｜教學重建，不是原引擎摘錄</text></svg>